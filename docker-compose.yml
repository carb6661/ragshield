services:
  api:
    build: ./backend
    environment:
      RAGSHIELD_DATABASE_URL: sqlite:////data/ragshield.db
      RAGSHIELD_CORS_ORIGINS: http://localhost:8080
      RAGSHIELD_ENABLE_NETWORK_TARGETS: "false"
      RAGSHIELD_HTTP_TARGET_ALLOWLIST: ""
      RAGSHIELD_ALLOW_PRIVATE_TARGETS: "false"
      RAGSHIELD_ALLOW_INSECURE_HTTP: "false"
    volumes:
      - ragshield-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  console:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  ragshield-data:
