name: Bug report
description: Report a reproducible defect in RAGShield
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Responsible-use check
      options:
        - label: This report contains no real secrets or unauthorized target data.
          required: true
  - type: input
    attributes:
      label: Version
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide a minimal, inert reproduction and the expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Operating system, Python or Docker version, and deployment mode.

